<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Posts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="coluna-esquerda">
      <h1>Posts</h1>
      <div id="loading">Carregando...</div>
      <div id="erro"></div>

      <h2>Novo Post</h2>
      <form id="form-post">
        <input type="text" id="titulo" placeholder="Título" required>
        <textarea id="corpo" placeholder="Corpo do post" required></textarea>
        <button type="submit">Enviar</button>
      </form>
    </div>

    <div class="coluna-Posts">
      <h2>Os Posts Adicionados</h2>
      <div id="new-posts"></div>
    </div>

    <div class="coluna-direita">
      <h2>Os 5 primeiros posts da API </h2>
      <div id="posts"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
